<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>국세환급금 충당청구(동의)서 - 출력</title>
<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/print.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/pdf-export.js"></script>
</head>
<body class="print-body">

<div class="print-toolbar no-print">
  <button class="btn btn-secondary btn-sm" onclick="window.print()">인쇄 / PDF 저장</button>
  <button class="btn btn-primary btn-sm" id="pdf-download-btn">PDF 다운로드</button>
</div>

<div class="print-page" id="print-root">
  <p class="text-center text-muted">불러오는 중...</p>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const submissionId = params.get('id');

function won(n) { return (Number(n) || 0).toLocaleString('ko-KR'); }

function refundRowsHtml(items) {
  const rows = (items && items.length ? items : [{}, {}]).slice(0, 4);
  while (rows.length < 2) rows.push({});
  const body = rows.map(it => `
    <tr>
      <td>${it.tax_item || ''}</td>
      <td>${it.year_period || ''}</td>
      <td>${won(it.total)}</td>
      <td>${won(it.national_tax)}</td>
      <td>${won(it.agri_edu_tax)}</td>
      <td>${won(it.surcharge)}</td>
      <td>${won(it.refund_surcharge)}</td>
    </tr>`).join('');
  const total = (items || []).reduce((s, it) => s + (Number(it.total) || 0), 0);
  return body + `<tr><td colspan="2" style="text-align:center; font-weight:700;">계</td><td colspan="5" style="font-weight:700;">${won(total)}</td></tr>`;
}

function offsetRowsHtml(items) {
  const rows = (items && items.length ? items : [{}, {}]).slice(0, 4);
  while (rows.length < 2) rows.push({});
  const body = rows.map(it => `
    <tr>
      <td>${it.payment_no || ''}</td>
      <td>${won(it.total)}</td>
      <td>${won(it.national_tax)}</td>
      <td>${won(it.agri_edu_tax)}</td>
      <td>${won(it.surcharge)}</td>
      <td>${it.note || ''}</td>
    </tr>`).join('');
  const total = (items || []).reduce((s, it) => s + (Number(it.total) || 0), 0);
  return body + `<tr><td style="text-align:center; font-weight:700;">계</td><td colspan="4" style="font-weight:700;">${won(total)}</td><td></td></tr>`;
}

let currentReceptionNumber = '';

async function load() {
  const root = document.getElementById('print-root');
  if (!submissionId) { root.innerHTML = '<p>접수 ID가 없습니다.</p>'; return; }

  try {
    const row = await getSubmissionDetail(submissionId);
    const f = (row.form_c_offset && row.form_c_offset[0]) || {};
    currentReceptionNumber = row.reception_number;
    render(row, f);
  } catch (err) {
    console.error(err);
    root.innerHTML = '<p>데이터를 불러오지 못했습니다. js/config.js 설정을 확인해 주세요.</p>';
  }
}

document.getElementById('pdf-download-btn').addEventListener('click', function () {
  const filename = `국세환급금충당청구동의서_${currentReceptionNumber || '접수번호미상'}.pdf`;
  downloadElementAsPdf(document.getElementById('print-root'), filename, this);
});

function render(row, f) {
  const refundTotal = (f.refund_items || []).reduce((s, it) => s + (Number(it.total) || 0), 0);
  const offsetTotal = (f.offset_items || []).reduce((s, it) => s + (Number(it.total) || 0), 0);
  const balance = f.balance ?? (refundTotal - offsetTotal);

  document.getElementById('print-root').innerHTML = `
    <div class="print-doc-no">■ 국세기본법 시행규칙 [별지 제19호의2서식] (접수번호: ${row.reception_number})</div>
    <div class="print-title">국세환급금 충당청구(동의)서</div>

    <table class="print-table">
      <tr>
        <td class="label-cell" rowspan="2">청구인</td>
        <td class="label-cell">성명(대표자)</td><td>${f.claimant_name || ''}</td>
        <td class="label-cell">주민등록번호</td><td>${f.claimant_rrn || ''}</td>
      </tr>
      <tr>
        <td class="label-cell">사업자등록번호</td><td>${f.claimant_biz_no || ''}</td>
        <td class="label-cell">주소</td><td>${f.claimant_address || ''} (전화: ${f.claimant_phone || ''})</td>
      </tr>
    </table>

    <p class="text-sm" style="font-weight:700; margin:14px 0 4px;">국세환급금내역</p>
    <table class="print-table">
      <tr><th>세목</th><th>연도·기분</th><th>계</th><th>내국세</th><th>농특세·교육세</th><th>가산금</th><th>환급가산금</th></tr>
      ${refundRowsHtml(f.refund_items)}
    </table>

    <p class="text-sm" style="font-weight:700; margin:14px 0 4px;">충당청구(동의)내역</p>
    <table class="print-table">
      <tr><th>전자납부번호</th><th>계</th><th>내국세</th><th>농특세·교육세</th><th>가산금</th><th>비고</th></tr>
      ${offsetRowsHtml(f.offset_items)}
    </table>

    <table class="print-table">
      <tr><td class="label-cell">잔액</td><td>${won(balance)}원</td></tr>
    </table>

    <p class="print-declaration">「국세기본법」 제51조에 따라 위와 같이 충당하여 주시기 바랍니다.</p>

    <div class="text-center" style="margin-bottom:14px;">
      ${new Date(row.created_at).getFullYear()}년　${new Date(row.created_at).getMonth()+1}월　${new Date(row.created_at).getDate()}일
    </div>

    <div class="print-sign-line">
      청구인
      ${f.claimant_signature ? `<img class="print-sign-img" src="${f.claimant_signature}">` : '&nbsp;&nbsp;&nbsp;&nbsp;(서명 또는 인)&nbsp;&nbsp;&nbsp;&nbsp;'}
    </div>

    ${f.agent_name ? `
    <table class="print-table" style="margin-top:16px;">
      <tr><td class="label-cell">대리인</td><td>${f.agent_name}</td><td class="label-cell">관계(직책)</td><td>${f.agent_relation || ''}</td></tr>
      <tr><td class="label-cell">전화번호</td><td colspan="3">${f.agent_phone || ''}</td></tr>
    </table>` : ''}

    <div class="print-footer-office">세무서장 귀하</div>

    <p class="print-note">
      첨부서류: 청구인 신분증 사본 1부 (대리인 신청시 위임장 원본 1부 추가)<br>
      접수번호: ${row.reception_number} / 처리상태: ${row.status} / 시스템 출력일시: ${new Date().toLocaleString('ko-KR')}<br>
      ※ 본 출력물은 온라인 동의서 시스템에서 생성된 참고용 서식입니다. 최종 법적 효력은 관할 세무서 확인 절차에 따릅니다.
    </p>
  `;
}

load();
</script>
</body>
</html>
