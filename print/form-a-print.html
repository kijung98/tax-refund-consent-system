<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>국세환급금양도요구서 - 출력</title>
<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/print.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase-client.js"></script>
</head>
<body class="print-body">

<div class="print-toolbar no-print">
  <button class="btn btn-primary btn-sm" onclick="window.print()">인쇄 / PDF 저장</button>
</div>

<div class="print-page" id="print-root">
  <p class="text-center text-muted">불러오는 중...</p>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const submissionId = params.get('id');

function won(n) { return (Number(n) || 0).toLocaleString('ko-KR'); }

function itemsRowsHtml(items) {
  const rows = (items && items.length ? items : [{}, {}]).slice(0, 4);
  while (rows.length < 2) rows.push({});
  const bodyRows = rows.map(it => `
    <tr>
      <td>${it.tax_item || ''}</td>
      <td>${it.due_date || ''}</td>
      <td>${won(it.total)}</td>
      <td>${won(it.national_tax)}</td>
      <td>${won(it.edu_tax)}</td>
      <td>${won(it.surcharge)}</td>
      <td>${won(it.refund_surcharge)}</td>
    </tr>`).join('');
  const total = (items || []).reduce((s, it) => s + (Number(it.total) || 0), 0);
  return bodyRows + `<tr><td colspan="2" style="text-align:center; font-weight:700;">계</td><td colspan="5" style="font-weight:700;">${won(total)}</td></tr>`;
}

async function load() {
  const root = document.getElementById('print-root');
  if (!submissionId) { root.innerHTML = '<p>접수 ID가 없습니다.</p>'; return; }

  try {
    const row = await getSubmissionDetail(submissionId);
    const f = (row.form_a_transfer && row.form_a_transfer[0]) || {};
    render(row, f);
  } catch (err) {
    console.error(err);
    root.innerHTML = '<p>데이터를 불러오지 못했습니다. js/config.js 설정을 확인해 주세요.</p>';
  }
}

function render(row, f) {
  document.getElementById('print-root').innerHTML = `
    <div class="print-doc-no">■ 국세기본법 시행규칙 [별지 제24호의2서식] (접수번호: ${row.reception_number})</div>
    <div class="print-title">국세환급금양도요구서</div>

    <table class="print-table">
      <tr>
        <td class="label-cell" rowspan="2">양도자</td>
        <td class="label-cell">성명(대표자)</td><td>${f.transferor_name || ''}</td>
        <td class="label-cell">주민등록번호</td><td>${f.transferor_rrn || ''}</td>
      </tr>
      <tr>
        <td class="label-cell">사업자등록번호</td><td>${f.transferor_biz_no || ''}</td>
        <td class="label-cell">주소</td><td>${f.transferor_address || ''} (전화: ${f.transferor_phone || ''})</td>
      </tr>
    </table>

    <table class="print-table">
      <tr>
        <td class="label-cell" rowspan="2">양수자</td>
        <td class="label-cell">성명(대표자)</td><td>${f.transferee_name || ''}</td>
        <td class="label-cell">주민등록번호</td><td>${f.transferee_rrn || ''}</td>
      </tr>
      <tr>
        <td class="label-cell">사업자등록번호</td><td>${f.transferee_biz_no || ''}</td>
        <td class="label-cell">주소</td><td>${f.transferee_address || ''} (전화: ${f.transferee_phone || ''})</td>
      </tr>
    </table>

    <p class="text-sm" style="font-weight:700; margin:14px 0 4px;">국세환급금명세서</p>
    <table class="print-table">
      <tr><th>세목</th><th>납부기한</th><th>계</th><th>내국세</th><th>교육세</th><th>가산금</th><th>국세환급가산금</th></tr>
      ${itemsRowsHtml(f.refund_items)}
    </table>

    <p class="text-sm" style="font-weight:700; margin:14px 0 4px;">양도하려는 금액</p>
    <table class="print-table">
      <tr><th>세목</th><th>납부기한</th><th>계</th><th>내국세</th><th>교육세</th><th>가산금</th><th>국세환급가산금</th></tr>
      ${itemsRowsHtml(f.transfer_amount_items)}
    </table>

    <p class="print-declaration">
      ${f.transferor_name || '(양도자)'}의 국세환급금(국세환급가산금 포함) 등을 ${f.transferee_name || '(양수자)'}에게
      양도하고 「국세기본법」 제53조 및 같은 법 시행령 제43조의4제1항에 따라 위와 같이 요구합니다.
    </p>

    <div class="text-center" style="margin-bottom:14px;">
      ${new Date(row.created_at).getFullYear()}년　${new Date(row.created_at).getMonth()+1}월　${new Date(row.created_at).getDate()}일
    </div>

    <div class="print-sign-block" style="flex-direction:column; align-items:flex-end;">
      <div class="print-sign-line">
        양도인
        ${f.transferor_signature ? `<img class="print-sign-img" src="${f.transferor_signature}">` : '&nbsp;&nbsp;&nbsp;&nbsp;(서명 또는 인)&nbsp;&nbsp;&nbsp;&nbsp;'}
      </div>
      <div class="print-sign-line">
        양수인
        ${f.transferee_signature ? `<img class="print-sign-img" src="${f.transferee_signature}">` : '&nbsp;&nbsp;&nbsp;&nbsp;(서명 또는 인)&nbsp;&nbsp;&nbsp;&nbsp;'}
      </div>
    </div>

    <div class="print-footer-office">세무서장 귀하</div>

    <p class="print-note">
      첨부서류: 양도인의 인감증명서 또는 본인서명사실확인서 1부 / 신고인 신분증 사본 1부 (대리인 신청시 위임장 등 추가)<br>
      접수번호: ${row.reception_number} / 처리상태: ${row.status} / 시스템 출력일시: ${new Date().toLocaleString('ko-KR')}<br>
      ※ 본 출력물은 온라인 동의서 시스템에서 생성된 참고용 서식입니다. 최종 법적 효력은 관할 세무서 확인 절차에 따릅니다.
    </p>
  `;
}

load();
</script>
</body>
</html>
