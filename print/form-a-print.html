<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>국세환급금양도요구서 - 출력</title>
<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/print.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/pdf-export.js"></script>
</head>
<body class="print-body">

<div class="print-toolbar no-print">
  <button class="btn btn-secondary btn-sm" onclick="window.print()">인쇄 / PDF 저장</button>
  <button class="btn btn-primary btn-sm" id="pdf-download-btn">PDF 다운로드</button>
</div>

<div class="print-page" id="print-root">
  <p class="text-center text-muted">불러오는 중...</p>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const submissionId = params.get('id');
let currentReceptionNumber = '';

function won(n) { return (Number(n) || 0).toLocaleString('ko-KR'); }
function esc(v) { return v || ''; }

function refundItemRows(items, maxRows) {
  const rows = (items || []).slice(0, maxRows);
  while (rows.length < maxRows) rows.push({});
  return rows.map(it => `
    <tr>
      <td>${esc(it.tax_item)}</td>
      <td>${esc(it.due_date)}</td>
      <td>${won(it.total)}</td>
      <td>${won(it.national_tax)}</td>
      <td>${won(it.edu_tax)}</td>
      <td>${won(it.surcharge)}</td>
      <td>${won(it.refund_surcharge)}</td>
    </tr>`).join('');
}

function itemsTotal(items) {
  return (items || []).reduce((s, it) => s + (Number(it.total) || 0), 0);
}

async function load() {
  const root = document.getElementById('print-root');
  if (!submissionId) { root.innerHTML = '<p>접수 ID가 없습니다.</p>'; return; }

  try {
    const row = await getSubmissionDetail(submissionId);
    const f = (row.form_a_transfer && row.form_a_transfer[0]) || {};
    currentReceptionNumber = row.reception_number;
    render(row, f);
  } catch (err) {
    console.error(err);
    root.innerHTML = '<p>데이터를 불러오지 못했습니다. js/config.js 설정을 확인해 주세요.</p>';
  }
}

function render(row, f) {
  document.getElementById('print-root').innerHTML = `
    <div class="print-doc-no">■ 국세기본법 시행규칙 [별지 제24호의2서식] &lt;개정 2023. 3. 20.&gt;</div>
    <div class="print-title">국세환급금양도요구서</div>

    <table class="print-table">
      <tr>
        <th style="width:33%;">접수번호</th>
        <th style="width:33%;">접수일</th>
        <th>처리기간</th>
      </tr>
      <tr>
        <td>${row.reception_number}</td>
        <td>${new Date(row.created_at).toLocaleDateString('ko-KR')}</td>
        <td></td>
      </tr>
    </table>

    <table class="print-table">
      <tr>
        <td class="label-cell" rowspan="4" style="width:10%; text-align:center;">양도자</td>
        <td class="label-cell" style="width:22%;">① 상 호(법인명)</td>
        <td style="width:33%;"></td>
        <td class="label-cell" style="width:22%;">② 성 명(대표자)</td>
        <td>${esc(f.transferor_name)}</td>
      </tr>
      <tr>
        <td class="label-cell">③ 사업자등록번호</td>
        <td>${esc(f.transferor_biz_no)}</td>
        <td class="label-cell">④ 주민등록번호</td>
        <td>${esc(f.transferor_rrn)}</td>
      </tr>
      <tr>
        <td class="label-cell">⑤ 사업장 소재지</td>
        <td colspan="3">(전화번호: ${esc(f.transferor_phone)})</td>
      </tr>
      <tr>
        <td class="label-cell">⑥ 주 소</td>
        <td colspan="3">${esc(f.transferor_address)} (전화번호: ${esc(f.transferor_phone)})</td>
      </tr>
    </table>

    <table class="print-table">
      <tr>
        <td class="label-cell" rowspan="4" style="width:10%; text-align:center;">양수자</td>
        <td class="label-cell" style="width:22%;">① 상 호(법인명)</td>
        <td style="width:33%;"></td>
        <td class="label-cell" style="width:22%;">② 성 명(대표자)</td>
        <td>${esc(f.transferee_name)}</td>
      </tr>
      <tr>
        <td class="label-cell">③ 사업자등록번호</td>
        <td>${esc(f.transferee_biz_no)}</td>
        <td class="label-cell">④ 주민등록번호</td>
        <td>${esc(f.transferee_rrn)}</td>
      </tr>
      <tr>
        <td class="label-cell">⑤ 사업장 소재지</td>
        <td colspan="3">(전화번호: ${esc(f.transferee_phone)})</td>
      </tr>
      <tr>
        <td class="label-cell">⑥ 주 소</td>
        <td colspan="3">${esc(f.transferee_address)} (전화번호: ${esc(f.transferee_phone)})</td>
      </tr>
    </table>

    <table class="print-table">
      <tr>
        <td class="label-cell" rowspan="4" style="width:10%; text-align:center;">국세환급금<br>명세서</td>
        <th>세목</th><th>납부기한</th><th>계</th><th>내국세</th><th>교육세</th><th>가산금</th><th>국세환급<br>가산금</th>
      </tr>
      ${refundItemRows(f.refund_items, 2)}
      <tr>
        <td colspan="2" style="text-align:center; font-weight:700;">계</td>
        <td colspan="5" style="font-weight:700;">${won(itemsTotal(f.refund_items))}</td>
      </tr>
    </table>

    <table class="print-table">
      <tr>
        <td class="label-cell" rowspan="4" style="width:10%; text-align:center;">양도하려는<br>금액</td>
        <th>세목</th><th>납부기한</th><th>계</th><th>내국세</th><th>교육세</th><th>가산금</th><th>국세환급<br>가산금</th>
      </tr>
      ${refundItemRows(f.transfer_amount_items, 2)}
      <tr>
        <td colspan="2" style="text-align:center; font-weight:700;">계</td>
        <td colspan="5" style="font-weight:700;">${won(itemsTotal(f.transfer_amount_items))}</td>
      </tr>
    </table>

    <p class="print-note" style="margin-top:4px;">
      ※ 가산금은 구 국세기본법 제2조제5호에 따른 가산금으로 2020년 1월 1일 전 납세의무 분에 적용됩니다.
    </p>

    <p class="print-declaration">
      (${esc(f.transferor_name)})의 국세환급금(국세환급가산금 포함) 등을 (${esc(f.transferee_name)})에게
      양도하려고 「국세기본법」 제53조 및 같은 법 시행령 제43조의4제1항에 따라 위와 같이 요구합니다.
    </p>

    <div class="text-center" style="margin-bottom:4px;">
      ${new Date(row.created_at).getFullYear()}년　${new Date(row.created_at).getMonth()+1}월　${new Date(row.created_at).getDate()}일
    </div>

    <div class="print-sign-block" style="flex-direction:column; align-items:flex-end;">
      <div class="print-sign-line">
        양도인
        ${f.transferor_signature ? `<img class="print-sign-img" src="${f.transferor_signature}">` : '&nbsp;&nbsp;&nbsp;&nbsp;(서명 또는 인)&nbsp;&nbsp;&nbsp;&nbsp;'}
      </div>
      <div class="print-sign-line">
        양수인
        ${f.transferee_signature ? `<img class="print-sign-img" src="${f.transferee_signature}">` : '&nbsp;&nbsp;&nbsp;&nbsp;(서명 또는 인)&nbsp;&nbsp;&nbsp;&nbsp;'}
      </div>
    </div>

    <div class="print-footer-office">세무서장 귀하</div>

    <table class="print-table" style="margin-top:6px;">
      <tr>
        <td class="label-cell" style="width:14%;">첨부서류</td>
        <td style="font-size:10px; line-height:1.5;">
          1. 양도인의 인감증명서 또는 본인서명사실확인서 1부
          2. 신고인 신분증 사본 1부
          3. 위임장 원본 1부
          4. 위임받은 자의 신분증 사본 1부<br>
          ※ 제2호부터 제4호까지의 서류는 대리인이 신청하는 경우에만 제출합니다.
        </td>
        <td class="label-cell" style="width:12%; text-align:center;">수수료<br>없음</td>
      </tr>
    </table>

    <p class="print-note" style="text-align:right; margin-top:4px;">210㎜×297㎜[백상지(80g/㎡) 또는 중질지(80g/㎡)]</p>

    <p class="print-note print-system-footer" style="margin-top:12px; border-top:1px dashed #999; padding-top:6px;">
      접수번호: ${row.reception_number} / 처리상태: ${row.status} / 시스템 출력일시: ${new Date().toLocaleString('ko-KR')}<br>
      ※ 본 출력물은 온라인 동의서 시스템에서 생성된 참고용 서식입니다. 최종 법적 효력은 관할 세무서 확인 절차에 따릅니다.
    </p>
  `;
}

document.getElementById('pdf-download-btn').addEventListener('click', function () {
  const filename = `국세환급금양도요구서_${currentReceptionNumber || '접수번호미상'}.pdf`;
  downloadElementAsPdf(document.getElementById('print-root'), filename, this);
});

load();
</script>
</body>
</html>
