<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>접수 상세보기</title>
<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/admin.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/excel-export.js"></script>
<script src="../js/auth-guard.js"></script>
<style>
  table.item-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  table.item-table th, table.item-table td { border: 1px solid var(--color-border); padding: 8px 10px; font-size: 13px; text-align: right; }
  table.item-table th { background: #F5F7FA; text-align: center; }
  table.item-table td:first-child, table.item-table th:first-child { text-align: left; }
</style>
</head>
<body>
<div class="admin-layout">

  <div class="detail-header">
    <div>
      <a href="index.html" class="text-sm">&larr; 목록으로</a>
      <h1 style="margin-top:6px;">접수 상세보기</h1>
    </div>
    <div class="actions">
      <button class="btn btn-secondary btn-sm" id="excel-one-btn">엑셀</button>
      <a href="#" id="print-link" class="btn btn-secondary btn-sm" target="_blank">인쇄(A4)</a>
      <span id="admin-bar"></span>
    </div>
  </div>

  <div id="detail-root">
    <div class="detail-section"><p class="text-muted">불러오는 중...</p></div>
  </div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const submissionId = params.get('id');

function requestTypeLabel(v) {
  return { '최초': '최초 신청', '변경_지분율': '변경(지분율 변경)', '변경_납세의무자': '변경(납세의무자 변경)', '특례취소': '특례 취소' }[v] || (v || '-');
}
function ntsResultLabel(v) {
  return { '신청유리': '특례 신청이 유리하다고 안내받음', '취소유리': '특례 취소가 유리하다고 안내받음', '모름': '안내받았으나 모름' }[v] || '해당없음 / 선택안함';
}
function checkIcon(v) { return v ? '<span class="check-icon-ok">O</span>' : '<span class="check-icon-no">X</span>'; }

/**
 * 주민등록번호를 기본적으로 뒷자리 마스킹(●●●●●●)해서 보여주고,
 * "보기"를 누르면 전체를 펼쳐 보여준다 (화면 노출을 최소화하기 위함 - 실제 값은
 * 이미 admin_list_submissions RPC를 통해 복호화되어 전달된 상태).
 */
function maskedRrnHtml(rrn) {
  if (!rrn) return '-';
  const id = 'rrn-' + Math.random().toString(36).slice(2, 9);
  const masked = rrn.length >= 8 ? rrn.slice(0, 8) + '●●●●●●' : '●●●●●●●●●●●●●';
  return `<span id="${id}-masked">${masked}</span><span id="${id}-full" style="display:none;">${rrn}</span> <a href="#" class="text-sm" onclick="toggleRrn('${id}', this); return false;" style="margin-left:6px;">보기</a>`;
}

function toggleRrn(id, linkEl) {
  const masked = document.getElementById(id + '-masked');
  const full = document.getElementById(id + '-full');
  const hidden = full.style.display === 'none';
  full.style.display = hidden ? 'inline' : 'none';
  masked.style.display = hidden ? 'none' : 'inline';
  linkEl.textContent = hidden ? '숨기기' : '보기';
}
function won(n) { return (Number(n) || 0).toLocaleString('ko-KR') + '원'; }

function itemsTableHtml(items, title) {
  if (!items || items.length === 0) return `<p class="text-sm text-muted">${title}: 입력된 항목 없음</p>`;
  const rowsHtml = items.map(it => `
    <tr>
      <td>${it.tax_item || '-'}</td>
      <td>${it.due_date || '-'}</td>
      <td>${won(it.national_tax)}</td>
      <td>${won(it.edu_tax)}</td>
      <td>${won(it.surcharge)}</td>
      <td>${won(it.refund_surcharge)}</td>
      <td><b>${won(it.total)}</b></td>
    </tr>`).join('');
  const total = items.reduce((s, it) => s + (Number(it.total) || 0), 0);
  return `
    <p class="text-sm" style="font-weight:700; margin-bottom:6px;">${title}</p>
    <table class="item-table">
      <thead><tr><th>세목</th><th>납부기한</th><th>내국세</th><th>교육세</th><th>가산금</th><th>국세환급가산금</th><th>계</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
      <tfoot><tr><td colspan="6" style="text-align:right; font-weight:700;">합계</td><td style="font-weight:700;">${won(total)}</td></tr></tfoot>
    </table>`;
}

/**
 * FORM C 등 컬럼 구성이 다른 항목 테이블을 위한 범용 렌더러.
 * headers: 표시할 컬럼명 배열, rowMapper: 항목 1건을 headers와 같은 길이의 배열로 변환하는 함수
 */
function itemsTableHtmlGeneric(items, title, headers, rowMapper) {
  if (!items || items.length === 0) return `<p class="text-sm text-muted">${title}: 입력된 항목 없음</p>`;
  const rowsHtml = items.map(it => `<tr>${rowMapper(it).map(v => `<td>${v}</td>`).join('')}</tr>`).join('');
  return `
    <p class="text-sm" style="font-weight:700; margin-bottom:6px;">${title}</p>
    <table class="item-table">
      <thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>`;
}

let currentSubmission = null;

async function loadDetail() {
  if (!submissionId) {
    document.getElementById('detail-root').innerHTML = '<div class="detail-section">접수 ID가 없습니다.</div>';
    return;
  }

  try {
    const row = await getSubmissionDetail(submissionId);
    currentSubmission = row;
    const b = (row.form_b_joint_home && row.form_b_joint_home[0]) || null;
    const a = (row.form_a_transfer && row.form_a_transfer[0]) || null;
    const c = (row.form_c_offset && row.form_c_offset[0]) || null;

    render(row, b, a, c);

    const printTarget = b ? 'form-b-print.html' : (a ? 'form-a-print.html' : (c ? 'form-c-print.html' : null));
    if (printTarget) document.getElementById('print-link').href = `../print/${printTarget}?id=${submissionId}`;
    else document.getElementById('print-link').style.display = 'none';
  } catch (err) {
    console.error(err);
    document.getElementById('detail-root').innerHTML = '<div class="detail-section">데이터를 불러오지 못했습니다. js/config.js 설정을 확인해 주세요.</div>';
  }
}

function renderHeader(row, formTypeLabel, extraRowsHtml) {
  return `
    <div class="detail-section">
      <h3>접수 정보</h3>
      <div class="detail-grid">
        <div class="summary-row"><span class="label">접수번호</span><span class="value">${row.reception_number}</span></div>
        <div class="summary-row"><span class="label">서식종류</span><span class="value">${formTypeLabel}</span></div>
        <div class="summary-row"><span class="label">제출일시</span><span class="value">${new Date(row.created_at).toLocaleString('ko-KR')}</span></div>
        ${extraRowsHtml || ''}
      </div>
      <div class="status-control" style="margin-top:16px;">
        <span class="badge badge-${row.status}">${row.status}</span>
        <select class="status-select" id="status-select">
          ${['신규','확인중','확인완료','출력완료','처리완료'].map(s => `<option value="${s}" ${s===row.status?'selected':''}>${s}</option>`).join('')}
        </select>
        <input type="text" id="staff-name" placeholder="담당자명" value="${row.staff_name || ''}" style="padding:9px 12px; border:1px solid var(--color-border); border-radius:8px; font-size:14px;">
        <button class="btn btn-primary btn-sm" id="save-status-btn">저장</button>
        <span class="text-sm text-muted" id="status-saved-msg" style="display:none;">저장됨</span>
      </div>
    </div>`;
}

function renderFormBSections(f) {
  return `
    <div class="detail-section">
      <h3>신청인 정보</h3>
      <div class="detail-grid">
        <div class="summary-row"><span class="label">성명</span><span class="value">${f.applicant_name || '-'}</span></div>
        <div class="summary-row"><span class="label">주민등록번호</span><span class="value">${maskedRrnHtml(f.applicant_rrn)}</span></div>
        <div class="summary-row full"><span class="label">주소</span><span class="value">${f.applicant_address || '-'}</span></div>
        <div class="summary-row"><span class="label">전화번호</span><span class="value">${f.applicant_phone || '-'}</span></div>
      </div>
    </div>

    <div class="detail-section">
      <h3>납세의무자 · 배우자 정보</h3>
      <div class="detail-grid">
        <div class="summary-row"><span class="label">납세의무자</span><span class="value">${f.taxpayer_name || '-'}</span></div>
        <div class="summary-row"><span class="label">납세의무자 주민등록번호</span><span class="value">${maskedRrnHtml(f.taxpayer_rrn)}</span></div>
        <div class="summary-row"><span class="label">배우자</span><span class="value">${f.spouse_name || '-'}</span></div>
        <div class="summary-row"><span class="label">배우자 주민등록번호</span><span class="value">${maskedRrnHtml(f.spouse_rrn)}</span></div>
      </div>
    </div>

    <div class="detail-section">
      <h3>점검항목</h3>
      <ul class="check-list">
        <li>${checkIcon(f.check_ownership_ratio)} 납세의무자 지분율이 배우자보다 높거나 같음</li>
        <li>${checkIcon(f.check_spouse_no_other_house)} 배우자 명의 다른 주택 없음</li>
        <li>${checkIcon(f.check_household_no_other_house)} 배우자 제외 세대원 소유 다른 주택 없음</li>
      </ul>
    </div>

    <div class="detail-section">
      <h3>동의 · 서명</h3>
      <div class="summary-row"><span class="label">배우자 동의확인</span><span class="value">${checkIcon(f.consent_confirmed)}</span></div>
      <div style="margin-top:14px;">
        <span class="text-sm text-muted" style="display:block; margin-bottom:8px;">신청인 서명</span>
        ${f.applicant_signature
          ? `<div class="signature-preview"><img src="${f.applicant_signature}" alt="신청인 서명"></div>`
          : '<span class="text-muted text-sm">서명 없음</span>'}
      </div>
    </div>`;
}

function renderFormASections(f) {
  return `
    <div class="detail-section">
      <h3>양도자 정보</h3>
      <div class="detail-grid">
        <div class="summary-row"><span class="label">성명</span><span class="value">${f.transferor_name || '-'}</span></div>
        <div class="summary-row"><span class="label">주민등록번호</span><span class="value">${maskedRrnHtml(f.transferor_rrn)}</span></div>
        <div class="summary-row"><span class="label">사업자등록번호</span><span class="value">${f.transferor_biz_no || '-'}</span></div>
        <div class="summary-row"><span class="label">전화번호</span><span class="value">${f.transferor_phone || '-'}</span></div>
        <div class="summary-row full"><span class="label">주소</span><span class="value">${f.transferor_address || '-'}</span></div>
      </div>
    </div>

    <div class="detail-section">
      <h3>양수자 정보</h3>
      <div class="detail-grid">
        <div class="summary-row"><span class="label">성명</span><span class="value">${f.transferee_name || '-'}</span></div>
        <div class="summary-row"><span class="label">주민등록번호</span><span class="value">${maskedRrnHtml(f.transferee_rrn)}</span></div>
        <div class="summary-row"><span class="label">사업자등록번호</span><span class="value">${f.transferee_biz_no || '-'}</span></div>
        <div class="summary-row"><span class="label">전화번호</span><span class="value">${f.transferee_phone || '-'}</span></div>
        <div class="summary-row full"><span class="label">주소</span><span class="value">${f.transferee_address || '-'}</span></div>
      </div>
    </div>

    <div class="detail-section">
      <h3>국세환급금 내역</h3>
      ${itemsTableHtml(f.refund_items, '국세환급금명세서')}
      <div style="height:16px;"></div>
      ${itemsTableHtml(f.transfer_amount_items, '양도하려는 금액')}
    </div>

    <div class="detail-section">
      <h3>서명</h3>
      <div class="detail-grid">
        <div>
          <span class="text-sm text-muted" style="display:block; margin-bottom:8px;">양도인 서명</span>
          ${f.transferor_signature
            ? `<div class="signature-preview"><img src="${f.transferor_signature}" alt="양도인 서명"></div>`
            : '<span class="text-muted text-sm">서명 없음</span>'}
        </div>
        <div>
          <span class="text-sm text-muted" style="display:block; margin-bottom:8px;">양수인 서명</span>
          ${f.transferee_signature
            ? `<div class="signature-preview"><img src="${f.transferee_signature}" alt="양수인 서명"></div>`
            : '<span class="text-muted text-sm">서명 없음</span>'}
        </div>
      </div>
    </div>`;
}

function renderFormCSections(f) {
  return `
    <div class="detail-section">
      <h3>청구인 정보</h3>
      <div class="detail-grid">
        <div class="summary-row"><span class="label">성명</span><span class="value">${f.claimant_name || '-'}</span></div>
        <div class="summary-row"><span class="label">주민등록번호</span><span class="value">${maskedRrnHtml(f.claimant_rrn)}</span></div>
        <div class="summary-row"><span class="label">사업자등록번호</span><span class="value">${f.claimant_biz_no || '-'}</span></div>
        <div class="summary-row"><span class="label">전화번호</span><span class="value">${f.claimant_phone || '-'}</span></div>
        <div class="summary-row full"><span class="label">주소</span><span class="value">${f.claimant_address || '-'}</span></div>
      </div>
    </div>

    ${f.agent_name ? `
    <div class="detail-section">
      <h3>대리인 정보</h3>
      <div class="detail-grid">
        <div class="summary-row"><span class="label">대리인</span><span class="value">${f.agent_name || '-'}</span></div>
        <div class="summary-row"><span class="label">관계(직책)</span><span class="value">${f.agent_relation || '-'}</span></div>
        <div class="summary-row"><span class="label">전화번호</span><span class="value">${f.agent_phone || '-'}</span></div>
      </div>
    </div>` : ''}

    <div class="detail-section">
      <h3>국세환급금 · 충당청구 내역</h3>
      ${itemsTableHtmlGeneric(f.refund_items, '국세환급금내역', ['세목','연도·기분','내국세','농특세·교육세','가산금','환급가산금','계'],
        it => [it.tax_item, it.year_period, won(it.national_tax), won(it.agri_edu_tax), won(it.surcharge), won(it.refund_surcharge), won(it.total)])}
      <div style="height:16px;"></div>
      ${itemsTableHtmlGeneric(f.offset_items, '충당청구(동의)내역', ['전자납부번호','내국세','농특세·교육세','가산금','비고','계'],
        it => [it.payment_no, won(it.national_tax), won(it.agri_edu_tax), won(it.surcharge), it.note || '-', won(it.total)])}
      <div class="summary-row full" style="margin-top:10px;"><span class="label">잔액</span><span class="value">${won(f.balance)}</span></div>
    </div>

    <div class="detail-section">
      <h3>서명</h3>
      <span class="text-sm text-muted" style="display:block; margin-bottom:8px;">청구인 서명</span>
      ${f.claimant_signature
        ? `<div class="signature-preview"><img src="${f.claimant_signature}" alt="청구인 서명"></div>`
        : '<span class="text-muted text-sm">서명 없음</span>'}
    </div>`;
}

function render(row, b, a, c) {
  let headerHtml, bodyHtml;

  if (b) {
    headerHtml = renderHeader(row, '종합부동산세 공동명의 1주택자 특례(변경)신청서', `
      <div class="summary-row"><span class="label">신청유형</span><span class="value">${requestTypeLabel(b.request_type)}</span></div>
      <div class="summary-row"><span class="label">국세청 안내 참고</span><span class="value">${ntsResultLabel(b.nts_notice_result)}</span></div>
    `);
    bodyHtml = renderFormBSections(b);
  } else if (a) {
    headerHtml = renderHeader(row, '국세환급금양도요구서', '');
    bodyHtml = renderFormASections(a);
  } else if (c) {
    headerHtml = renderHeader(row, '국세환급금 충당청구(동의)서', '');
    bodyHtml = renderFormCSections(c);
  } else {
    headerHtml = renderHeader(row, '알 수 없음', '');
    bodyHtml = '<div class="detail-section"><p class="text-muted">연결된 서식 데이터가 없습니다.</p></div>';
  }

  document.getElementById('detail-root').innerHTML = headerHtml + bodyHtml;

  document.getElementById('save-status-btn').addEventListener('click', async () => {
    const status = document.getElementById('status-select').value;
    const staffName = document.getElementById('staff-name').value.trim();
    try {
      await updateStatus(row.id, status, staffName);
      document.getElementById('status-saved-msg').style.display = 'inline';
      setTimeout(() => { document.getElementById('status-saved-msg').style.display = 'none'; }, 1500);
      row.status = status;
      row.staff_name = staffName;
    } catch (err) {
      alert('상태 저장 중 오류가 발생했습니다.');
      console.error(err);
    }
  });
}

document.getElementById('excel-one-btn').addEventListener('click', () => {
  if (currentSubmission) exportSubmissionsToExcel([currentSubmission], `동의서_${currentSubmission.reception_number}.xlsx`);
});

(async () => {
  const session = await requireAdminAuth();
  if (!session) return;
  renderAdminBar('admin-bar', session);
  loadDetail();
})();
</script>
</body>
</html>
